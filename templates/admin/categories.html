<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .category-header {
            margin-bottom: 20px;
        }

        .category-title {
            font-size: 22px;
            font-weight: 700;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .category-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 15px;
            background: var(--primary-light);
            color: var(--primary);
        }

        .category-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .category-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .category-count {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--success-light);
            color: var(--success);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="app-layout">

    {% include 'includes/admin_sidebar.html' %}

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOP HEADER -->
        <div class="top-header">
            <div class="page-title">Categories</div>
        </div>

        <div class="content-container">

            <!-- CATEGORY TITLE -->
            <div class="category-header">
                <div class="category-title">All Categories</div>
            </div>

            <!-- GRID -->
            <div class="category-grid"></div>

        </div>

    </main>

</div>

<!-- ================= JS ================= -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const container = document.querySelector(".category-grid");

    const emojiMap = {
        "Industry": "🏭",
        "Doctor": "🩺",
        "Play School": "🎒",
        "General": "📁"
    };

    fetch("/admin/categories")
        .then(res => res.json())
        .then(data => {

            container.innerHTML = "";

            data.forEach(cat => {

                const emoji = emojiMap[cat.category] || "📁";

                const card = document.createElement("div");
                card.className = "category-card";

                card.innerHTML = `
                    <div class="badge">${cat.files_count} Files</div>
                    <div class="category-icon">${emoji}</div>
                    <div class="category-name">${cat.category}</div>
                    <div class="category-desc">
                        Explore all ${cat.category} files
                    </div>
                 
                `;

                card.onclick = () => {
                    window.location.href = `/admin/category-page/${cat.category}`;
                };

                container.appendChild(card);
            });

        })
        .catch(err => {
            console.error("Error loading categories:", err);
        });

});
</script>

</body>
</html>
