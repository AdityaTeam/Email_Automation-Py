<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC Emails - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-layout">

        {% include 'includes/admin_sidebar.html' %}
        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">📨 Global CC Emails</h1>
            </header>

            <div class="content-container">
                <div class="section">
                    <div class="section-header">
                        <h2 class="section-title">CC Email List</h2>
                        <button class="btn btn-primary btn-sm" onclick="showAddModal()">+ Add CC Email</button>
                    </div>
                    {% if cc_emails %}
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email Address</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for cc in cc_emails %}
                                <tr>
                                    <td><strong>{{ cc.name }}</strong></td>
                                    <td>{{ cc.email }}</td>
                                    <td>
                                        <button class="action-btn" onclick='editCC({{ cc | tojson }})'>Edit</button>
                                        <button class="action-btn danger" onclick="deleteCC('{{ cc._id }}')">Delete</button>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    {% else %}
                    <div class="empty-state"><div class="empty-state-icon">📭</div><h3>No CC emails configured</h3></div>
                    {% endif %}
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit CC Modal -->
    <div id="ccModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="ccModalTitle">Add CC Email</h3>
                <button class="close-btn" onclick="closeCCModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="ccId">
                <div class="form-group">
                    <label for="ccName">Name</label>
                    <input type="text" id="ccName" class="form-control" placeholder="e.g., Manager">
                </div>
                <div class="form-group">
                    <label for="ccEmail">Email Address</label>
                    <input type="email" id="ccEmail" class="form-control" placeholder="e.g., manager@company.com">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCCModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveCC()">Save</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        function showAddModal() {
            document.getElementById('ccModalTitle').textContent = 'Add CC Email';
            document.getElementById('ccId').value = '';
            document.getElementById('ccName').value = '';
            document.getElementById('ccEmail').value = '';
            document.getElementById('ccModal').classList.add('active');
        }

        function editCC(cc) {
            document.getElementById('ccModalTitle').textContent = 'Edit CC Email';
            document.getElementById('ccId').value = cc._id;
            document.getElementById('ccName').value = cc.name;
            document.getElementById('ccEmail').value = cc.email;
            document.getElementById('ccModal').classList.add('active');
        }

        function closeCCModal() {
            document.getElementById('ccModal').classList.remove('active');
        }

        async function saveCC() {
            const id = document.getElementById('ccId').value;
            const name = document.getElementById('ccName').value.trim();
            const email = document.getElementById('ccEmail').value.trim();

            if (!name || !email) {
                showToast('Please fill all fields', 'error');
                return;
            }

            try {
                let url, method;
                if (id) {
                    url = `/api/cc-emails/${id}`;
                    method = 'PUT';
                } else {
                    url = '/api/cc-emails';
                    method = 'POST';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });

                const data = await response.json();
                if (data.success) {
                    showToast(id ? 'CC email updated' : 'CC email added', 'success');
                    closeCCModal();
                    location.reload();
                } else {
                    showToast(data.error || 'Error saving', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        async function deleteCC(ccId) {
            if (!confirm('Are you sure you want to delete this CC email?')) return;

            try {
                const response = await fetch(`/api/cc-emails/${ccId}`, { method: 'DELETE' });
                const data = await response.json();
                if (data.success) {
                    showToast('CC email deleted', 'success');
                    location.reload();
                } else {
                    showToast(data.error || 'Error deleting', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✓', error: '✕', info: 'ℹ' };
            toast.innerHTML = `<span>${icons[type] || icons.info}</span> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
